[project]
name = "smoothment"
version = "0.1.0"
description = "Bank statements to MoneyWiz CSV, with transfer linking and verification"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "rich>=13",
    "tomli-w>=1.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.scripts]
smoothment = "smoothment.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "ty",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ty.rules]
# every rule at error level (default set); nothing downgraded

[tool.pytest.ini_options]
testpaths = ["tests"]
